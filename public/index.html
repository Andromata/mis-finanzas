<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis finanzas</title><link rel="stylesheet" href="/style.css"></head><body><aside><a class="brand" href="/">◈ <span>mis finanzas</span></a><div class="workspace">ESPACIO PERSONAL</div><nav><button data-view="overview" class="active">◫ &nbsp; Resumen</button><button data-view="movements">↕ &nbsp; Movimientos</button><button data-view="accounts">▣ &nbsp; Mis cuentas</button><button data-view="shared">♧ &nbsp; Gastos compartidos</button><button data-view="forecast">◷ &nbsp; Próximo mes</button><button data-view="import">⇧ &nbsp; Importar tarjeta</button></nav><div class="aside-bottom"><b>Un poco de orden,<br>más tranquilidad.</b><p>Tus números, en un solo lugar.</p><small>ARS · Peso argentino</small></div></aside><main><header><span>Tu dinero, con claridad</span><span class="profile">● &nbsp; Mi espacio</span></header><div id="content"></div></main><dialog id="modal"><form id="movement-form"><div class="dialog-title"><h2>Nuevo movimiento</h2><button type="button" id="close" class="plain">✕</button></div><div class="form-grid"><label>Tipo<select name="type"><option value="expense">Egreso</option><option value="income">Ingreso</option></select></label><label>Fecha<input name="date" type="date" required></label><label class="wide">Descripción<input name="description" placeholder="¿En qué lo usaste?" required maxlength="200"></label><label>Importe total (ARS)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Cuenta<select name="accountId" id="account-select"></select></label><label>Categoría<select name="category"><option>Supermercado</option><option>Hogar</option><option>Servicios</option><option>Transporte</option><option>Salidas</option><option>Salud</option><option>Sueldo</option><option>Otros</option></select></label><label>Cuotas<input name="installments" type="number" min="1" max="120" value="1" required></label><label>Parte que te deben (%)<input name="sharedPercent" type="number" min="0" max="100" value="0" required></label><label>Quién te debe<input name="person" placeholder="Por ejemplo, mi esposo"></label></div><p class="hint">El importe total se distribuye desde el mes de la fecha elegida. La deuda compartida corresponde a la compra completa.</p><button class="primary" type="submit">Guardar movimiento</button><p id="form-error" role="alert"></p></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
